seed: 42
robot:
  radius: 0.18
  max_lin_vel: 0.6
  max_ang_vel: 1.8
  max_lin_acc: 0.8
  max_ang_acc: 2.5
lidar:
  num_beams: 240
  angle_min: -3.141592653589793
  angle_max: 3.141592653589793
  range_min: 0.12
  range_max: 8.0
  noise_std: 0.01
  scan_every: 2
sim:
  dt: 0.05
  world_file: "configs/worlds/office.yaml"
  odom_noise:
    alpha_v: 0.03
    alpha_w: 0.03
    floor: 0.0001
mapping:
  resolution: 0.05
  l_occ: 0.85
  l_free: -0.4
  l_clamp: 10.0
  occupied_thresh: 0.65
  free_thresh: 0.25
  beam_subsample: 2
slam:
  keyframe_trans: 0.2
  keyframe_rot: 0.35
  min_motion: 0.02
  match_beams: 80
  coarse_window_xy: 0.15
  coarse_step_xy: 0.05
  coarse_window_theta: 0.12
  coarse_step_theta: 0.03
  fine_step_xy: 0.025
  fine_step_theta: 0.01
  blur_sigma_cells: 1.5
  min_match_score: 0.1
localization:
  num_particles: 500
  alphas: [0.05, 0.05, 0.05, 0.05]
  init_std: [0.25, 0.25, 0.15]
  resample_neff_frac: 0.5
  likelihood:
    sigma_hit: 0.2
    z_hit: 0.9
    z_rand: 0.1
    max_dist: 2.0
    beam_subsample: 5
planning:
  costmap:
    occupied_thresh: 65
    unknown_is_lethal: true
    inflation_radius: 0.45
    cost_decay: 6.0
  astar:
    w_cost: 4.0
    simplify: true
  dwa:
    sim_time: 1.5
    sim_dt: 0.1
    v_samples: 8
    w_samples: 15
    lookahead: 0.8
    w_progress: 1.0
    w_heading: 0.6
    w_clearance: 0.4
    w_velocity: 0.3
nav:
  goal_tol_xy: 0.25
  replan_period: 4.0
  path_block_check_dist: 1.0
  max_recoveries: 3
  recovery_rotate_speed: 0.8
  recovery_backup_dist: 0.3
  recovery_backup_speed: 0.1
logging:
  level: "INFO"
  file: "logs/amr.log"
  max_bytes: 1000000
  backup_count: 3
  console: true
  module_levels: {}
gui:
  refresh_ms: 66
  px_per_cell: 3
  speed_factor: 1.0
